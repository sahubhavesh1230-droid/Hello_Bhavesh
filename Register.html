<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    /* Reset and Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Form Card Container */
    .form-container {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .form-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-header h2 {
      color: #333;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #666;
      font-size: 14px;
    }

    /* Input Groups */
    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #444;
      font-weight: 600;
      font-size: 14px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dcdcdc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    /* Gender Selection */
    .gender-options {
      display: flex;
      gap: 20px;
      margin-top: 5px;
    }

    .gender-label {
      font-weight: normal !important;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Terms Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 20px 0;
    }

    .checkbox-group input {
      margin-top: 3px;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 13px;
      color: #555;
      line-height: 1.4;
      cursor: pointer;
    }

    .checkbox-group a {
      color: #667eea;
      text-decoration: none;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Form Footer */
    .form-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .form-footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="form-header">
      <h2>Create Account</h2>
      <p>Join us today! It takes only a few steps.</p>
    </div>

    <form action="#" method="POST">
      <!-- Full Name -->
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required />
      </div>

      <!-- Email Address -->
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required />
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required />
      </div>

      <!-- Gender -->
      <div class="input-group">
        <label>Gender</label>
        <div class="gender-options">
          <label class="gender-label">
            <input type="radio" name="gender" value="male" required /> Male
          </label>
          <label class="gender-label">
            <input type="radio" name="gender" value="female" /> Female
          </label>
          <label class="gender-label">
            <input type="radio" name="gender" value="other" /> Other
          </label>
        </div>
      </div>

      <!-- Terms and Conditions -->
      <div class="checkbox-group">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="#">Terms &amp; Conditions</a> and <a href="#">Privacy Policy</a>.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="form-footer">
      Already have an account? <a href="#">Log in</a>
    </div>
  </div>

</body>
</html>
