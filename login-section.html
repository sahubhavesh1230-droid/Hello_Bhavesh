<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --transition: 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-dark);
      text-decoration: none;
      margin-bottom: 0.5rem;
    }

    .brand-logo span {
      width: 10px;
      height: 10px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    .brand-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      background: #ffffff;
      transition: border-color var(--transition), box-shadow var(--transition);
      font-family: inherit;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .toggle-password {
      position: absolute;
      right: 0.85rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
    }

    .toggle-password:hover {
      color: var(--text-dark);
    }

    .forgot-link {
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 1.25rem 0;
    }

    .checkbox-group input {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition), transform var(--transition);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider span {
      padding: 0 0.75rem;
    }

    .btn-oauth {
      width: 100%;
      padding: 0.75rem;
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background-color var(--transition), border-color var(--transition);
    }

    .btn-oauth:hover {
      background-color: var(--bg-body);
      border-color: #cbd5e1;
    }

    .card-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .card-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="login-container">
    <div class="brand-header">
      <a href="/" class="brand-logo"><span></span>ApexUI</a>
      <p>Enter your account credentials to continue</p>
    </div>

    <section class="login-card">
      <form onsubmit="event.preventDefault(); alert('Login request submitted.');">
        <div class="form-group">
          <label for="email">Work Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="name@company.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <button type="button" class="btn-oauth">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
        </svg>
        Sign in with GitHub
      </button>

      <div class="card-footer">
        Don't have an account? <a href="Create.html">Create one</a>
      </div>
    </section>
  </main>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const btn = document.querySelector('.toggle-password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = 'Hide';
      } else {
        pwd.type = 'password';
        btn.textContent = 'Show';
      }
    }
  </script>

</body>
</html>
