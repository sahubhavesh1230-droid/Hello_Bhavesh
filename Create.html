<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Account</title>
  <style>
    /* Reset & Fonts */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Form Card Container */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      padding: 36px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .card-header p {
      font-size: 14px;
      color: #6b7280;
    }

    /* Social Sign-up Option */
    .social-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .social-btn:hover {
      background-color: #f9fafb;
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #9ca3af;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e5e7eb;
    }

    .divider span {
      padding: 0 12px;
    }

    /* Form Fields */
    .form-row {
      display: flex;
      gap: 12px;
    }

    .input-group {
      margin-bottom: 16px;
      flex: 1;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .input-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      color: #111827;
      background-color: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .input-group input:focus {
      background-color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .input-group input::placeholder {
      color: #9ca3af;
    }

    /* Password Hint */
    .password-hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    /* Terms & Checkbox */
    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 20px 0;
    }

    .checkbox-group input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.4;
      cursor: pointer;
    }

    .checkbox-group a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .checkbox-group a:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background-color: #4338ca;
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    /* Footer */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #6b7280;
    }

    .card-footer a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .card {
        padding: 24px 20px;
      }
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Create an account</h1>
      <p>Start your 30-day free trial. No credit card required.</p>
    </div>

    <!-- Optional Social Signup -->
    <button type="button" class="social-btn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign up with Google
    </button>

    <div class="divider">
      <span>or sign up with email</span>
    </div>

    <form action="#" method="POST">
      <!-- First Name & Last Name (Side by Side) -->
      <div class="form-row">
        <div class="input-group">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first-name" placeholder="John" required />
        </div>
        <div class="input-group">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last-name" placeholder="Doe" required />
        </div>
      </div>

      <!-- Email Address -->
      <div class="input-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="john.doe@example.com" required />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required />
        <p class="password-hint">Must be at least 8 characters.</p>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required />
      </div>

      <!-- Checkbox -->
      <div class="checkbox-group">
        <input type="checkbox" id="terms" required />
        <label for="terms">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Create account</button>
    </form>

    <div class="card-footer">
      Already have an account? <a href="#">Log in</a>
    </div>
  </div>

</body>
</html>
